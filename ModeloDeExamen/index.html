<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wumpa Store</title>
    <link rel="icon" href="./src/web/wumpa.webp" type="image/webp">
    <link rel="stylesheet" href="./style/estandarizacion.css">
    <link rel="stylesheet" href="./style/estilo.css">
    <script src="./script/productos-v2.js" defer></script>

</head>

<body>
    <header>
        <div id="logo-container">
            <img id="img-logo" src="./src/web/Crash_logo.png" alt=" Logo">
        </div>
            <img id="btn-reproducir-musica" src="./src/web/play.png">
        <div class="flex">
            <div>
                <input id="buscador" placeholder="Buscar productos">
            </div>
            <div class="carrito">
                <img id="imgCarrito" src="./src/web/carrito.png" alt="carrito">
            </div>
        </div>
    </header>
    <main>
        <section id="seccion-productos">
            <h2 class="centrar">Playstation</h2>
            <div id="contedor-productos" class="contenedor"></div>
        </section>
        <section id="seccion-carrito">
            <h2 class="centrar">Carrito</h2>
            <div id="contedor-carrito" class="contenedor"></div>
            <div id="total-carrito" class="centrar">Total: $0</div>
        </section>
    </main>
    <footer class="centrar">
        <img src="./src/web/Crash_Fake.webp" alt="">
    </footer>
</body>
</html>
